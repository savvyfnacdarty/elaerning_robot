<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dreame X60 Pro Ultra Complete – Académie Fnac Darty</title>
<meta name="description" content="E-learning : mise en service, connexion Wi-Fi et entretien du robot Dreame X60 Pro Ultra Complete.">
<style>:root{--black:#111;--ink:#1d1d1f;--yellow:#E9AB00;--yellow-l:#FFF3CC;--orange:#F26B43;--red:#C10F1E;--red-l:#FDECEE;--green:#0B8A43;--green-l:#E4F5EB;--bg:#F1F1F1;--card:#fff;--line:#E1E1E1;--mut:#5b5b5f}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45;min-height:100vh}
button{font:inherit;cursor:pointer}
header{background:var(--black);color:#fff;position:relative;overflow:hidden}
.hd{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.hd img{height:72px;width:auto;display:block}
.hd h1{font-size:20px;line-height:1.15;margin:0;font-weight:700;flex:1}
.hd h1 small{display:block;font-weight:400;font-size:14px;color:#cfcfcf;margin-top:2px}
.chev{position:absolute;right:0;top:0;bottom:0;width:90px;background:linear-gradient(180deg,#FBAE40,#C10F1E);clip-path:polygon(60% 0,100% 0,100% 100%,60% 100%,100% 50%);opacity:.95}
.hd .pg{font-size:14px;text-align:right;color:#ddd;margin-right:70px;white-space:nowrap}
.bar{height:5px;background:#333}.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .4s}
nav.steps{background:#fff;border-bottom:1px solid var(--line)}
nav.steps .in{max-width:1080px;margin:0 auto;display:flex;gap:4px;padding:8px 20px;overflow-x:auto}
nav.steps button{flex:1 1 0;min-width:150px;border:0;background:#f4f4f4;border-radius:10px;padding:8px 12px;text-align:left;color:#333;display:flex;gap:10px;align-items:center;border:2px solid transparent}
nav.steps button .n{width:28px;height:28px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
nav.steps button .l{font-size:15px;line-height:1.15;font-weight:600}
nav.steps button .l small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
nav.steps button.on{border-color:var(--yellow);background:#fff}
nav.steps button.on .n{background:var(--black);color:var(--yellow)}
nav.steps button.done .n{background:var(--green);color:#fff}
main{max-width:1080px;margin:0 auto;padding:22px 20px 40px}
.screen{background:var(--card);border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.07);padding:28px 30px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700;margin:0 0 4px}
h2{font-size:30px;line-height:1.15;margin:0 0 14px}
h3{font-size:20px;margin:0 0 8px}
p{margin:0 0 12px}
.lead{font-size:20px;color:#333}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.box.ok{border-color:#9ad4b3;background:var(--green-l)}
.box.ko{border-color:#ee9aa2;background:var(--red-l)}
.box.key{border-color:var(--yellow);background:var(--yellow-l)}
.box h3{display:flex;gap:8px;align-items:center}
.ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:15px;font-weight:700;color:#fff;flex:none}
.ico.ok{background:var(--green)}.ico.ko{background:var(--red)}.ico.w{background:var(--yellow);color:#111}
ul.l{margin:0;padding-left:0;list-style:none}
ul.l li{padding:5px 0 5px 28px;position:relative}
ul.l li:before{content:"";position:absolute;left:4px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--yellow)}
ul.ok li:before{background:var(--green)}ul.ko li:before{background:var(--red)}
.callout{border-left:6px solid var(--yellow);background:var(--yellow-l);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.callout.red{border-color:var(--red);background:var(--red-l)}
.callout.green{border-color:var(--green);background:var(--green-l)}
.imgc{text-align:center}.imgc img{max-width:100%;max-height:230px;border-radius:10px;object-fit:contain}
.cap{font-size:14px;color:var(--mut);margin-top:4px}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:2px 10px;background:#eee}
.pill.ok{background:var(--green);color:#fff}.pill.ko{background:var(--red);color:#fff}.pill.w{background:var(--yellow);color:#111}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#d0d0d0}.dots i.on{background:var(--yellow);transform:scale(1.25)}.dots i.past{background:var(--black)}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:17px;background:var(--black);color:#fff}
.btn:hover{background:#333}.btn.y{background:var(--yellow);color:#111}.btn.y:hover{background:#f4b91a}
.btn.ghost{background:#fff;color:#111;border:2px solid #ccc}.btn.ghost:hover{background:#f4f4f4}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:17px;display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--yellow);background:var(--yellow-l)}
.opt .k{width:28px;height:28px;border-radius:8px;background:#eee;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.opt.right{border-color:var(--green);background:var(--green-l)}.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-l)}.opt.wrong .k{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;padding:12px 16px;border-radius:10px;display:none}
.fb.show{display:block}.fb.ok{background:var(--green-l);border-left:6px solid var(--green)}.fb.ko{background:var(--red-l);border-left:6px solid var(--red)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-weight:600;font-size:16px}
.tab.on{background:var(--black);color:#fff;border-color:var(--black)}
table.t{border-collapse:collapse;width:100%;font-size:16px}
table.t th{background:var(--black);color:#fff;text-align:left;padding:8px 10px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line)}
table.t tr:nth-child(even) td{background:#fafafa}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;counter-reset:s}
.steps5 .st{border-radius:12px;background:#fff;border:1px solid var(--line);padding:14px 12px;position:relative;text-align:center}
.steps5 .st b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--yellow);color:#111;margin:0 auto 8px;font-size:18px}
.steps5 .st.last{background:var(--black);color:#fff}.steps5 .st.last b{background:var(--red);color:#fff}
.hero{background:var(--black);color:#fff;border-radius:16px;padding:34px 36px;display:flex;gap:26px;align-items:center;position:relative;overflow:hidden}
.hero img{height:150px;flex:none}
.hero h2{font-size:34px;color:#fff;margin-bottom:8px}.hero .lead{color:#ddd}
.hero:after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:120px;background:linear-gradient(180deg,#FBAE40,#C10F1E);clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%,100% 50%)}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.path button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left}
.path button:hover{border-color:var(--yellow);box-shadow:0 3px 12px rgba(0,0,0,.08)}
.path .num{font-size:30px;font-weight:800;color:var(--yellow);line-height:1}
.path .mn{font-size:14px;color:var(--mut)}
.score{font-size:64px;font-weight:800;line-height:1}
.qbar{height:8px;border-radius:5px;background:#e5e5e5;margin-bottom:18px}.qbar i{display:block;height:100%;border-radius:5px;background:var(--yellow);transition:width .3s}
.sel{font:inherit;padding:9px 10px;border-radius:8px;border:2px solid #ccc;background:#fff;max-width:100%}
.sel.right{border-color:var(--green);background:var(--green-l)}.sel.wrong{border-color:var(--red);background:var(--red-l)}
.mrow{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;margin:8px 0}
.sock text{font-family:inherit}
.meas{font-weight:800}
@media(max-width:820px){body{font-size:17px}.grid2,.grid3,.grid4,.path{grid-template-columns:1fr}.steps5{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center;padding:26px 20px}.hero img{height:110px}.screen{padding:20px 16px}h2{font-size:25px}.hd h1{font-size:16px}.hd img{height:56px}.hd .pg{display:none}.chev{width:50px}.mrow{grid-template-columns:1fr}}

.vo{max-width:1080px;margin:0 auto;padding:12px 20px 0}
.vo .in{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vo button.vb{border:2px solid var(--black);background:var(--black);color:#fff;border-radius:99px;padding:5px 14px;font-weight:700;font-size:15px}
.vo button.vb.g{background:#fff;color:#111;border-color:#ccc}
.vo details{flex:1 1 100%;font-size:15px;color:#333}.vo summary{cursor:pointer;color:var(--mut)}
.vo details p{margin:6px 0 2px}
footer.cr{max-width:1080px;margin:0 auto;padding:0 20px 24px;font-size:12.5px;color:var(--mut)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px}
.tools b{margin-right:4px}
.chip{background:#fff;border:1px solid #ccc;border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px}

.path{grid-template-columns:repeat(3,1fr)}
.imgc.w img{max-height:250px}.imgc.tall img{max-height:400px}
.tools{margin-top:14px}
table.t td:first-child{white-space:nowrap}
@media(max-width:820px){.path{grid-template-columns:1fr}table.t td:first-child{white-space:normal}}
</style></head><body>

cfVsNI/EgeAbUYQ8qr1y0OiP5wzQgsamhqyXMG4ByDIWXxe9TCd97BiropTSwBfAAkBmFQIv7uq7HMb21G6c+AZF8M8uJtL8OyzAQgAwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLi7bB/wMjRRd9MoIUSAAAAABJRU5ErkJggg=="};const NARR={"home": "Bonjour et bienvenue dans ce module sur le robot aspirateur et laveur Dreame X60 Pro Ultra Complete. En vingt minutes environ, on va voir comment le déballer, le mettre en service, le connecter au Wi-Fi et l'entretenir. Vous pouvez faire pause quand vous voulez. C'est parti !", "m1_s1": "Commençons par présenter le produit. Le X60 Pro Ultra Complete aspire et lave les sols en même temps. Il évite les obstacles grâce à sa navigation à vision binoculaire, et son capteur VersaLift s'abaisse dans les zones à faible dégagement. Sa vraie force, c'est la station : elle recharge le robot, vide son bac, lave et sèche les serpillières, et remplit son eau. Et tout se pilote avec l'appli Dreamehome, à la voix ou avec les boutons du robot.", "m1_s2": "Voici ce que vous saurez faire à la fin. Installer et mettre en service le robot et sa station. Le connecter au Wi-Fi avec l'application Dreamehome. Faire l'entretien courant et savoir ce qui relève du SAV. Et dépanner les problèmes les plus fréquents. Le parcours : environ cinq minutes pour la mise en service, quatre pour le Wi-Fi, trois et demie pour l'entretien, puis une FAQ et un quiz final de dix questions pour valider vos acquis.", "m2_s1": "Premier réflexe : on ouvre le carton et on vérifie le contenu, en s'aidant de la liste de la notice. Il doit y avoir le robot, la station avec sa plaque de rampe, le module de distribution de solution, la solution de nettoyage, les serpillières, les brosses, le bac à poussière et les sacs. Ensuite, on contrôle l'état : pas de choc, pas de pièce cassée, et surtout un cordon intact. S'il est abîmé, on ne le branche pas, on contacte le SAV.", "m2_s2": "Avant d'allumer quoi que ce soit, on retire toutes les protections de transport. Sur la station, les films de protection de la façade et des pièces. Et sous le robot, les bandes de protection. Prenez le temps de bien inspecter : rien ne doit rester sur la station ni sous le robot. Et gardez l'emballage d'origine pour un éventuel transport.", "m2_s3": "Un point sécurité avant de brancher. Le robot est fait pour un usage domestique, en intérieur : pas dans une salle de bain, ni autour d'une piscine. La température doit rester entre 0 et 40 degrés. Enfants et animaux restent à distance, et on ne pose rien sur le robot. Au bord d'un escalier, on installe une barrière. On utilise uniquement la station et la batterie d'origine, sans rien démonter. Et on ne fixe pas le laser. Jamais d'utilisation dans une chambre où dort un enfant.", "m2_s4": "Où placer la station ? Choisissez l'endroit le plus dégagé possible, avec un bon signal Wi-Fi. Gardez un mètre devant la station et cinq centimètres de chaque côté, sans aucun objet dans la zone grisée. Rien ne doit masquer la zone d'émission du signal. Idéalement, on la pose sur du carrelage ou du marbre, pour éviter que l'eau ne mouille parquet ou tapis. Et jamais près d'une source de chaleur.", "m2_s5": "On prépare ensuite la pièce. On ramasse câbles, chaussettes, jouets, et on met à l'abri les objets fragiles. On pose une barrière au bord des escaliers, on ouvre les portes et on libère le passage. Attention aux objets durs ou tranchants : cailloux, billes, verre, clous, ils peuvent rayer le sol. Et lors du premier passage, suivez le robot pour retirer à temps tout obstacle.", "m2_s6": "On installe la station. Un : on la pose et on branche le cordon, en l'enfonçant fermement vers le haut jusqu'à ce que le voyant s'allume. Deux : on installe la plaque d'extension de rampe. Trois : on vérifie que le filtre de la planche à laver est bien en place. Retenez les voyants : blanc fixe, la station est alimentée. Orange fixe, il y a une erreur sur la station.", "m2_s7": "Maintenant, l'eau et la solution de nettoyage. Pour la solution : on retire le couvercle du bac à poussière, on sort le module de distribution, on verse la solution officielle Dreame, on referme, on remet le module bien engagé, puis le couvercle. Pour l'eau : on sort le réservoir d'eau propre, on le remplit d'eau propre, jamais d'eau chaude, et on le remet. Aucun autre liquide : ni alcool, ni désinfectant.", "m2_s8": "Place au robot. D'abord, on l'allume : appui long de trois secondes sur le bouton d'alimentation. Ensuite, on le retourne et on fixe les serpillières sur leurs supports. Puis on pose le robot sur la station, contacts de charge alignés : une annonce vocale confirme la charge. Idéalement, on charge complètement le robot avant la première utilisation, environ deux heures. Si la batterie est vide, posez-le à la main sur la station.", "m2_s9": "Apprenons à lire les voyants. Sur le cercle lumineux : bleu fixe, nettoyage ou lavage terminé ; bleu pulsé, il attend une commande vocale ou se connecte au Wi-Fi ; vert pulsé, il charge ; rouge clignotant, erreur. Sur le bouton : blanc fixe, tâche terminée ; blanc qui clignote lentement, charge ; rouge fixe ou pulsé, batterie faible ; rouge clignotant, erreur.", "m2_s10": "Quelques réglages à connaître. À la première utilisation, le mode par défaut est aspiration et nettoyage. Après la connexion, l'appli propose une cartographie rapide : le robot cartographie sans nettoyer, et la carte s'enregistre à son retour. Le mode Ne pas déranger est désactivé par défaut. La reprise après recharge s'active dans l'appli. Et pour le premier nettoyage, lancez-le depuis la station : le robot retrouvera plus facilement son chemin.", "m3_s1": "Avant de commencer, vérifiez les prérequis. Le plus important : le robot ne reconnaît que le Wi-Fi 2,4 gigahertz, pas le 5. Vérifiez aussi que le signal est bon à l'emplacement de la station, ayez le mot de passe de votre réseau sous la main, et un smartphone connecté, prêt à installer l'application Dreamehome.", "m3_s2": "On installe l'application Dreamehome. Soit vous scannez le QR code du robot avec l'appareil photo du téléphone, soit vous cherchez Dreamehome dans l'App Store ou Google Play. Installez-la, puis connectez-vous : si vous n'avez pas de compte, il est créé automatiquement après vérification de votre numéro de mobile. Les écrans évoluent avec les mises à jour : suivez toujours les messages de l'appli.", "m3_s3": "Voici l'appairage pas à pas. Un : allumez le robot, appui long de trois secondes. Deux : dans Dreamehome, touchez « Scannez le code QR pour vous connecter ». Trois : scannez à nouveau le QR code du robot, ou choisissez l'ajout manuel et sélectionnez le X60 dans la liste. Quatre : suivez les instructions pour finir la connexion Wi-Fi. Le voyant Wi-Fi du robot vous guide : il clignote lentement quand il est prêt, rapidement pendant la connexion, et reste allumé une fois connecté.", "m3_s4": "On valide le fonctionnement. Le voyant Wi-Fi est allumé fixe, et le robot apparaît dans l'appli. Astuce du constructeur : profitez-en pour mettre à jour le firmware, dans les réglages de l'appli. Ensuite, lancez la cartographie rapide pour tester. Attention au bouton de réinitialisation : un appui de trois secondes déconnecte le robot du Wi-Fi et rétablit les paramètres d'usine. Pour reconnecter, refaites simplement le scan du QR code.", "m3_s5": "Si la connexion échoue, vérifiez dans l'ordre. Le mot de passe du Wi-Fi est-il correct ? Le réseau est-il bien en 2,4 gigahertz ? Le signal est-il suffisant à l'endroit où se trouve le robot ? Et si rien n'y fait, le robot n'est peut-être pas prêt à être configuré : quittez l'application, rouvrez-la, et recommencez la procédure.", "m4_s1": "Voici le calendrier d'entretien. Après chaque utilisation : le réservoir d'eau usagée, et la brosse de plinthes si vous l'avez utilisée. Toutes les deux semaines : réservoir d'eau propre, brosses, filtre du bac et plateaux de serpillière. Une fois par mois : contacts de charge, capteurs, roues, évents et dessous du robot. Puis le filtre de planche à laver tous les un à deux mois, et le module de chauffage tous les six mois.", "m4_s2": "Les consommables se remplacent selon l'usage. Les serpillières, tous les un à trois mois. Le sac à poussière, tous les deux à quatre mois. Le filtre du bac et la brosse latérale, tous les trois à six mois. Les brosses principales et la brosse de plinthes, tous les six à douze mois. Ce sont des repères : remplacez dès que l'usure se voit.", "m4_s3": "Les gestes les plus fréquents. Réservoir d'eau usagée : on le vide et on le rince à l'eau claire après chaque tâche, sans forcer sur la bille flottante. Sac à poussière : on le jette en tirant la poignée vers le haut pour le verrouiller, on essuie le filtre à sec, on met un sac neuf. Bac et filtre : on tapote, on rince à l'eau claire sans détergent, et on sèche complètement.", "m4_s4": "Brosses, planche à laver et capteurs. Pour les brosses : on les soulève, on retire poils et cheveux, on les remet jusqu'au clic, et on dévisse la brosse latérale pour la dégager. Pour la planche à laver : on rince le filtre, en attendant qu'il refroidisse, et on détartre le module de chauffage au vinaigre blanc tous les six mois. Les capteurs et les contacts, eux, s'essuient uniquement avec un chiffon doux et sec. Et on débranche la station avant d'intervenir.", "m4_s5": "Les erreurs à éviter : détergent sur le bac et le filtre, brosse ou objet pointu sur le filtre, chiffon humide sur les capteurs, pièce remontée encore humide, déplacer la station ou les réservoirs pendant l'usage, toucher la sortie d'eau chaude. Et repérez les signaux : un bruit qui augmente, une odeur, un robot qui patine ou s'écarte de son itinéraire, une charge lente, un bac qui n'est plus vidé. Dans tous ces cas, un entretien s'impose.", "m4_s6": "Ce que vous pouvez faire seul : vider et rincer les réservoirs, changer le sac et les serpillières, nettoyer bac, filtres, brosses, capteurs et détartrer le chauffage. Ce qui relève du SAV : tout ce qui touche à la batterie, qui ne se remplace que par un technicien qualifié, un cordon endommagé, un support de serpillière qui ne se soulève pas, ou un problème qui persiste après vos vérifications.", "m5_s1": "Première série. Le robot ne s'allume pas : on le recharge et on vérifie la température. Il ne charge pas : cordon, contacts, connecteurs. Il ne s'éteint pas : on l'éloigne de la station et on appuie trois secondes, ou dix pour forcer l'arrêt. Et s'il ne retrouve pas sa station, on dégage le trajet et on essuie la zone d'émission du signal.", "m5_s2": "Deuxième série. Bloqué devant la station : de l'espace, un sol sec, et la plaque de rampe bien installée. Pas de reprise après recharge : le mode Ne pas déranger, ou un robot reposé à la main. La station ne vide pas : sac plein ou évents obstrués. Et pour un bruit qui augmente : bac bouché, brosse bloquée, ou mode Standard et Silencieux.", "m5_s3": "Dernière série. De l'eau sous le réservoir d'eau propre : c'est normal, on essuie. Niveau d'eau anormal dans la planche à laver : on vérifie le joint, le réservoir et l'orifice d'évacuation. Un robot qui s'écarte de son itinéraire : cordons rangés, sol sec, vitre essuyée, portes ouvertes. Et rappelez-vous : usage intérieur uniquement, pas de salle de bain.", "q1": "Question 1 sur 10. Où installer la station d’accueil ? Une seule réponse est correcte. Réponse A : Dans la salle de bain, près d’un point d’eau. Réponse B : Dans une zone dégagée, avec un bon signal Wi-Fi, de préférence sur carrelage ou marbre. Réponse C : Contre un radiateur, pour sécher plus vite les serpillières. Réponse D : Sur un tapis épais pour amortir les vibrations.", "a1": "C'est la B. La station se place dans l'endroit le plus dégagé possible, avec un bon Wi-Fi, un mètre libre devant et cinq centimètres de chaque côté. Le carrelage ou le marbre est recommandé pour protéger parquet et tapis. Jamais en salle de bain, ni près d'une source de chaleur.", "q2": "Question 2 sur 10. Que verse-t-on dans le réservoir d’eau propre ? Une seule réponse est correcte. Réponse A : De l’eau chaude, pour mieux dissoudre la saleté. Réponse B : De l’eau avec un peu d’alcool ou de désinfectant. Réponse C : De l’eau propre, sans eau chaude ; la solution Dreame va dans le module de distribution. Réponse D : De l’eau et du vinaigre blanc, pour détartrer.", "a2": "C'est la C. Dans le réservoir, uniquement de l'eau propre, jamais d'eau chaude. La solution officielle Dreame va dans le module de distribution. Alcool, désinfectant et vinaigre n'y ont pas leur place : le vinaigre sert seulement à détartrer le chauffage.", "q3": "Question 3 sur 10. Dans quelle plage de température peut-on utiliser le robot ? Une seule réponse est correcte. Réponse A : Il n’y a pas de limite en intérieur. Réponse B : De −10 °C à 30 °C. Réponse C : De 5 °C à 50 °C. Réponse D : De 0 °C à 40 °C.", "a3": "C'est la D : de zéro à quarante degrés, sur un sol sans liquide ni substance collante. En dehors, la batterie peut refuser de démarrer et la charge ralentit.", "q4": "Question 4 sur 10. Quel type de réseau Wi-Fi le robot accepte-t-il ? Une seule réponse est correcte. Réponse A : Le Wi-Fi 2,4 GHz uniquement. Réponse B : Le Wi-Fi 5 GHz uniquement. Réponse C : Les deux bandes, 2,4 et 5 GHz. Réponse D : Aucun : il se connecte en Bluetooth.", "a4": "C'est la A : uniquement le Wi-Fi deux virgule quatre gigahertz. Le cinq gigahertz n'est pas pris en charge. Si votre box émet sur les deux bandes, vérifiez que le robot est bien relié à la 2,4.", "q5": "Question 5 sur 10. Comment ajouter le robot dans l’application Dreamehome ? Une seule réponse est correcte. Réponse A : Brancher un câble Ethernet entre le robot et la box. Réponse B : Saisir le numéro de série sur le site de Dreame. Réponse C : Appuyer 3 s sur le bouton de réinitialisation et attendre. Réponse D : Allumer le robot, puis scanner son QR code depuis l’appli (ou ajouter le modèle manuellement).", "a5": "C'est la D. On allume le robot, on ouvre Dreamehome, on scanne le QR code du robot, ou on ajoute le modèle manuellement, puis on suit les instructions de l'appli. Aucun câble n'est nécessaire.", "q6": "Question 6 sur 10. Le voyant Wi-Fi du robot clignote rapidement. Que signifie-t-il ? Une seule réponse est correcte. Réponse A : Le robot est connecté. Réponse B : Le robot est prêt à être connecté. Réponse C : La connexion est en cours. Réponse D : Le robot est en erreur.", "a6": "C'est la C. Le voyant clignote lentement quand le robot est prêt, rapidement pendant la connexion, et reste fixe une fois connecté.", "q7": "Question 7 sur 10. À quelle fréquence nettoie-t-on le réservoir d’eau usagée ? Une seule réponse est correcte. Réponse A : Une fois par mois. Réponse B : Après chaque utilisation. Réponse C : Tous les 6 mois. Réponse D : Seulement s’il y a une odeur.", "a7": "C'est la B : après chaque utilisation, pour éviter les odeurs. Le réservoir d'eau propre, lui, s'entretient toutes les deux semaines.", "q8": "Question 8 sur 10. Comment nettoie-t-on le bac à poussière et son filtre ? Une seule réponse est correcte. Réponse A : Avec un détergent et une brosse. Réponse B : Au lave-vaisselle. Réponse C : À l’eau claire, sans détergent, puis séchage complet avant remontage. Réponse D : Avec un chiffon humide, sans les retirer.", "a8": "C'est la C. On tapote le panier du filtre, on rince à l'eau claire sans détergent, jamais de brosse, et on remonte uniquement des pièces complètement sèches.", "q9": "Question 9 sur 10. Le robot ne reprend pas le nettoyage après sa recharge. Que vérifier en premier ? Une seule réponse est correcte. Réponse A : Le mode Ne pas déranger, la reprise automatique, et qu’il n’a pas été reposé à la main sur la station. Réponse B : Remplacer la batterie. Réponse C : Changer de réseau Wi-Fi. Réponse D : Remplacer la solution de nettoyage.", "a9": "C'est la A. Le mode Ne pas déranger empêche la reprise, et la reprise automatique doit être activée dans l'appli. Le robot ne reprend pas non plus s'il a été posé à la main sur la station.", "q10": "Question 10 sur 10. En retirant le réservoir d’eau propre, de l’eau apparaît sous le réservoir. Que faire ? Une seule réponse est correcte. Réponse A : Arrêter le robot et appeler le SAV. Réponse B : C’est normal : essuyer avec un chiffon sec. Réponse C : Remplacer le joint immédiatement. Réponse D : Vider et sécher toute la station.", "a10": "C'est la B : c'est normal. L'eau restée dans le tuyau peut couler sous le réservoir ou autour du joint. On essuie avec un chiffon sec, et on continue.", "res_ok": "Bravo, module validé ! Bravo, vous avez terminé ce module ! Retenez l'essentiel : une station dégagée avec un mètre devant, le Wi-Fi 2,4 gigahertz, de l'eau propre et la solution officielle, un entretien régulier, et le SAV pour la batterie et le cordon. En cas de doute, rendez-vous avec nos centres d’appels, nos comptoirs SAV magasin et puis nos ateliers SAV FNAC Darty. Merci, et à bientôt !", "res_ko": "Le module n'est pas encore validé : il faut au moins huit bonnes réponses sur dix. Revoyez les items concernés, puis refaites le quiz."};const QUIZ=[{"q": "Où installer la station d’accueil ?", "o": ["Dans la salle de bain, près d’un point d’eau", "Dans une zone dégagée, avec un bon signal Wi-Fi, de préférence sur carrelage ou marbre", "Contre un radiateur, pour sécher plus vite les serpillières", "Sur un tapis épais pour amortir les vibrations"], "ok": [1], "multi": false, "w": "La station se place dans l’endroit le plus dégagé possible, avec un bon signal Wi-Fi : 1 m libre devant et 5 cm de chaque côté. Le carrelage ou le marbre est recommandé pour éviter que l’eau ne mouille parquet et tapis. À éviter : la salle de bain et toute source de chaleur.", "rev": "Item 2 · Mise en service"}, {"q": "Que verse-t-on dans le réservoir d’eau propre ?", "o": ["De l’eau chaude, pour mieux dissoudre la saleté", "De l’eau avec un peu d’alcool ou de désinfectant", "De l’eau propre, sans eau chaude ; la solution Dreame va dans le module de distribution", "De l’eau et du vinaigre blanc, pour détartrer"], "ok": [2], "multi": false, "w": "Le réservoir d’eau propre reçoit uniquement de l’eau propre, jamais d’eau chaude (risque de déformation). La solution officielle Dreame se verse dans le module de distribution automatique. Alcool, désinfectant et vinaigre n’ont rien à faire dans ce réservoir : le vinaigre sert seulement à détartrer le module de chauffage.", "rev": "Item 2 · Mise en service"}, {"q": "Dans quelle plage de température peut-on utiliser le robot ?", "o": ["Il n’y a pas de limite en intérieur", "De −10 °C à 30 °C", "De 5 °C à 50 °C", "De 0 °C à 40 °C"], "ok": [3], "multi": false, "w": "Le robot s’utilise entre 0 °C et 40 °C, sur un sol sans liquide ni substance collante. Hors de cette plage, la batterie peut refuser de démarrer et la charge ralentit pour la préserver.", "rev": "Item 2 · Mise en service"}, {"q": "Quel type de réseau Wi-Fi le robot accepte-t-il ?", "o": ["Le Wi-Fi 2,4 GHz uniquement", "Le Wi-Fi 5 GHz uniquement", "Les deux bandes, 2,4 et 5 GHz", "Aucun : il se connecte en Bluetooth"], "ok": [0], "multi": false, "w": "Seul le Wi-Fi 2,4 GHz est reconnu. Le 5 GHz n’est pas pris en charge : c’est une cause classique d’échec d’appairage. Si votre box émet sur les deux bandes, vérifiez que le robot est bien relié à la connexion 2,4 GHz.", "rev": "Item 3 · Connexion Wi-Fi"}, {"q": "Comment ajouter le robot dans l’application Dreamehome ?", "o": ["Brancher un câble Ethernet entre le robot et la box", "Saisir le numéro de série sur le site de Dreame", "Appuyer 3 s sur le bouton de réinitialisation et attendre", "Allumer le robot, puis scanner son QR code depuis l’appli (ou ajouter le modèle manuellement)"], "ok": [3], "multi": false, "w": "On allume le robot (appui long de 3 s), on ouvre Dreamehome, on touche « Scannez le code QR pour vous connecter » <script>/* ===== Utilitaires ===== */
const $=(s,r=document)=>r.querySelector(s);

const KEY='fd-dreame-x60-v1';

let cur=-1,scr=0;
/* ===== SCORM 1.2 ===== */
const SC=(function(){
 let api=null,passed=false,closed=false;const t0=Date.now();
 const find=w=>{let n=0;try{while(w){if(w.API)return w.API;if(w.parent&&w.parent!==w&&n++<20)w=w.parent;else break}}catch(e){}return null};
 try{api=find(window)||(window.opener?find(window.opener):null)}catch(e){}
 const g=k=>{try{return String(api.LMSGetValue(k))}catch(e){return ''}};
 const st=(k,v)=>{try{api.LMSSetValue(k,String(v))}catch(e){}};
 const cm=()=>{try{api.LMSCommit('')}catch(e){}};
 const p2=n=>('0'+n).slice(-2);
 const fmt=ms=>{const t=Math.round(ms/1000);return ('000'+Math.floor(t/3600)).slice(-4)+':'+p2(Math.floor(t%3600/60))+':'+p2(t%60)};
 return{
  active:()=>!!api,
  init(){if(!api)return null;
   try{api.LMSInitialize('')}catch(e){api=null;return null}
   const s=g('cmi.core.lesson_status');
   if(s==='not attempted'||s==='')st('cmi.core.lesson_status','incomplete');
   passed=(s==='passed'||s==='completed');
   let sd=null;try{sd=JSON.parse(g('cmi.suspend_data')||'null')}catch(e){}
   cm();return sd},
  sync(){if(!api)return;st('cmi.suspend_data',JSON.stringify({d:ST.done,b:ST.best,l:[cur,scr]}));st('cmi.core.lesson_location',cur+'.'+scr);cm()},
  result(score,ok){if(!api)return;
   st('cmi.core.score.min',0);st('cmi.core.score.max',100);st('cmi.core.score.raw',score*10);
   if(ok){passed=true;st('cmi.core.lesson_status','passed')}else if(!passed){st('cmi.core.lesson_status','failed')}
   this.sync()},
  end(){if(!api||closed)return;closed=true;
   st('cmi.core.session_time',fmt(Date.now()-t0));st('cmi.core.exit',passed?'':'suspend');cm();try{api.LMSFinish('')}catch(e){}}
 }})();
if(!SC.active()){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)ST=Object.assign(ST,x)}catch(e){}}
const save=()=>{if(SC.active())SC.sync();else{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}};
window.addEventListener('pagehide',()=>SC.end());window.addEventListener('beforeunload',()=>SC.end());window.addEventListener('unload',()=>SC.end());
/* ===== Voix off ===== */
let voiceOn=true;try{voiceOn=localStorage.getItem('fd-voice')!=='0'}catch(e){}
const AUD=new Audio();AUD.preload='auto';
function updV(){const pl=$('#vplay'),mu=$('#vmute');if(!pl)return;pl.textContent=AUD.paused?'▶ Écouter':'⏸ Pause';mu.textContent=voiceOn?'🔊 Voix off activée':'🔇 Voix off coupée';mu.setAttribute('aria-pressed',voiceOn)}
function voice(key){
 AUD.pause();const t=$('#vtxt');if(t)t.textContent=NARR[key]||'';
 AUD.src='audio/'+key+'.mp3';
 if(voiceOn){const p=AUD.play();if(p&&p.catch)p.catch(()=>{})}
 updV();
}
['play','pause','ended'].forEach(e=>AUD.addEventListener(e,updV));
const L=['A','B','C','D'];

/* QCM générique : opts=[texte], ok=[index], multi=bool, why */
function okTxt(ok){return ok.map(i=>L[i]).join(' + ')}
function mcq(root,{opts,ok,why,multi=false,okMsg='Bonne réponse !',koMsg='Pas tout à fait.',onDone}){
  if(typeof ok==='number')ok=[ok];
  const box=document.createElement('div');
  box.innerHTML=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k${multi?' m':''}">${L[i]}</span><span>${o}</span></button>`).join('')}</div>${multi?'<button class="btn y vok" disabled>Valider ma réponse</button>':''}<div class="fb" role="status" aria-live="polite"></div>`;
  root.appendChild(box);
  const fb=$('.fb',box),btns=$$('.opt',box),sel=new Set();
  const done=()=>{
    const good=sel.size===ok.length&&ok.every(i=>sel.has(i));
    btns.forEach((x,i)=>{x.disabled=true;x.classList.remove('sel');if(ok.includes(i))x.classList.add('right');else if(sel.has(i))x.classList.add('wrong')});
    fb.className='fb show '+(good?'ok':'ko');
    fb.innerHTML=`<b>${good?okMsg:koMsg}</b> ${good?'':`Bonne réponse : <b>${okTxt(ok)}</b>. `}${why}`;
    const v=$('.vok',box);if(v)v.style.display='none';
    onDone&&onDone(good,[...sel]);
  };
  btns.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!multi){sel.add(i);done();return}
    sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel',sel.has(i));$('.vok',box).disabled=sel.size===0;
  }));
  if(multi)$('.vok',box).addEventListener('click',done);
}

const MODS=[

/* ===== Application ===== */
const app=$('#app');
const total=MODS.length;
const TOTALMIN=17;
function updTop(){
 const d=Object.keys(ST.done).length;
 $('.bar i').style.width=(d/total*100)+'%';
 $('#pg').textContent=d+'/'+total+' items terminés';
 $$('nav.steps button').forEach((b,i)=>{b.classList.toggle('on',i-1===cur);const m=MODS[i-1];b.classList.toggle('done',!!(m&&ST.done[m.id]))});
}
function buildNav(){
 $('nav.steps .in').innerHTML=`<button data-m="-1"><span class="n">⌂</span><span class="l">Accueil<small>Présentation</small></span></button>`+MODS.map((m,i)=>`<button data-m="${i}"><span class="n">${m.id}</span><span class="l">${m.short}<small>≈ ${m.min} min</small></span></button>`).join('');
 $$('nav.steps button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.m,0)));
}
function go(m,s){cur=m;scr=s;render();window.scrollTo({top:0,behavior:'smooth'})}
function home(){
 app.innerHTML=`<div class="hero"><img src="${IMG.logo}" alt="Académie Fnac Darty"><div style="position:relative;z-index:1;padding-right:70px"><p class="kicker" style="color:var(--yellow)">E‑learning · Robots aspirateurs laveurs</p><h2>Dreame X60 Pro Ultra Complete : mise en service, Wi-Fi et entretien</h2><p class="lead">Déballer, installer, connecter et entretenir le robot : tous les gestes pour bien démarrer et le garder performant.</p></div></div>
 <div class="path">${MODS.map((m,i)=>`<button data-m="${i}"><div class="num">${m.id}</div><b>${m.quiz?'Quiz final':m.title}</b><div class="mn">≈ ${m.min} min${m.quiz?' · 10 questions':''}${ST.done[m.id]?' · ✓ terminé':''}</div></button>`).join('')}</div>
 <div class="callout" style="margin-top:18px"><b>Durée totale : environ ${TOTALMIN} minutes.</b> Suivez les items dans l’ordre puis validez avec le quiz (8 bonnes réponses sur 10).${ST.best!=null?` Votre meilleur score : <b>${ST.best}/10</b>.`:''}</div>
 <div class="foot"><span></span><button class="btn y" id="start">Commencer ›</button></div>`;
 $$('.path button',app).forEach(b=>b.onclick=()=>go(+b.dataset.m,0));$('#start').onclick=()=>go(0,0);
}
function render(){
 updTop();
 if(cur<0){home();voice('home');return}
 const m=MODS[cur];
 if(m.quiz){quiz();return}
 const S=m.screens,s=S[scr];
 app.innerHTML=`<section class="screen" id="sc">${s.html()}</section><div class="foot"><button class="btn ghost" id="pv" ${scr===0&&cur===0?'disabled':''}>‹ Précédent</button><div class="dots">${S.map((_,i)=>`<i class="${i===scr?'on':i<scr?'past':''}"></i>`).join('')}</div><button class="btn y" id="nx">${scr===S.length-1?(cur<total-1?(MODS[cur+1].quiz?'Passer au quiz ›':'Item suivant ›'):'Terminer'):'Suivant ›'}</button></div>`;
 s.init&&s.init($('#sc'));
 voice('m'+m.id+'_s'+(scr+1));
 $('#pv').onclick=()=>{if(scr>0)go(cur,scr-1);else if(cur>0)go(cur-1,MODS[cur-1].screens?MODS[cur-1].screens.length-1:0);else go(-1,0)};
 $('#nx').onclick=()=>{
  if(scr<S.length-1)go(cur,scr+1);
  else{ST.done[m.id]=1;save();go(cur+1,0)}
 };
 if(scr===S.length-1){ST.done[m.id]=1;updTop()}
 save();
}
function quiz(){
 let i=0,sc=0;const miss=[];
 const draw=()=>{
  if(i>=QUIZ.length)return result();
  const q=QUIZ[i];voice('q'+(i+1));
  app.innerHTML=`<section class="screen"><p class="kicker">Quiz final · Question ${i+1}/${QUIZ.length} · ${q.rev}</p><div class="qbar"><i style="width:${i/QUIZ.length*100}%"></i></div><h2 style="font-size:24px">${q.q}</h2><p class="cap" style="margin:-6px 0 6px">Une seule réponse possible.</p><div id="qq"></div></section>`;
  mcq($('#qq'),{opts:q.o,ok:q.ok,multi:q.multi,why:q.w,onDone:g=>{if(g)sc++;else miss.push(i);voice('a'+(i+1));const b=document.createElement('button');b.className='btn y';b.style.marginTop='14px';b.textContent=i+1<QUIZ.length?'Question suivante ›':'Voir mon résultat';b.onclick=()=>{i++;draw()};$('#qq').appendChild(b);b.focus()}});
 };
 const result=()=>{
  const pass=sc>=8;if(ST.best==null||sc>ST.best)ST.best=sc;if(pass)ST.done[MODS[total-1].id]=1;save();SC.result(sc,pass);updTop();voice(pass?'res_ok':'res_ko');
  const recap=`<div class="grid3" style="text-align:left;margin:16px 0">${okBox('Station et réseau',[`1 m devant, 5 cm de chaque côté`,`Wi-Fi 2,4 GHz uniquement`,`Appli Dreamehome · QR code · firmware à jour`])}${warnBox('Eau et entretien',[`Eau propre froide dans le réservoir`,`Solution officielle dans le module`,`Réservoir usagé après chaque utilisation`])}${koBox('SAV',[`Batterie`,`Cordon endommagé`,`Panne persistante`])}</div><div class="box key" style="text-align:left;margin:0 0 16px"><h3>Besoin d’aide ?</h3><ul class="l"><li>Centre d’appel FNAC Darty</li><li>Comptoir SAV magasin FNAC Darty</li><li>Ateliers SAV FNAC Darty</li></ul></div>`;
  app.innerHTML=`<section class="screen" style="text-align:center"><p class="kicker">Résultat du quiz</p><div class="score" style="color:${pass?'var(--green)':'var(--red)'}">${sc}/10</div><h2 style="margin-top:10px">${pass?'Module validé, bravo !':'Pas encore validé (8/10 requis)'}</h2><p class="lead">${pass?'Vous savez mettre en service, connecter et entretenir le Dreame X60 Pro Ultra Complete. En cas de doute, contactez le SAV.':'Revoyez les items concernés puis retentez le quiz.'}</p>
  ${pass?recap:''}
  ${miss.length?`<div class="box" style="text-align:left;margin:16px 0"><h3>Questions à revoir</h3><ul class="l">${miss.map(k=>`<li><b>Q${k+1} · ${QUIZ[k].rev}</b><br>${QUIZ[k].q}<br><span style="color:var(--green)">✓ ${QUIZ[k].ok.map(j=>QUIZ[k].o[j]).join(' · ')}</span></li>`).join('')}</ul></div>`:''}
  <div class="foot" style="justify-content:center"><button class="btn ghost" id="rv">Revoir les items</button><button class="btn y" id="rt">Refaire le quiz</button></div></section>`;
  $('#rv').onclick=()=>go(-1,0);$('#rt').onclick=()=>go(total-1,0);
 };
 draw();
}
$('#vplay').onclick=()=>{if(AUD.paused){if(!AUD.src)voice(vk());else AUD.play().catch(()=>{})}else AUD.pause()};
$('#vmute').onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('fd-voice',voiceOn?'1':'0')}catch(e){}if(!voiceOn)AUD.pause();else AUD.play().catch(()=>{});updV()};
const vk=()=>cur<0?'home':'m'+MODS[cur].id+'_s'+(scr+1);
const sd=SC.init();
if(sd){ST.done=Object.assign(ST.done,sd.d||{});if(sd.b!=null)ST.best=sd.b;if(sd.l&&sd.l[0]>=0&&sd.l[0]<MODS.length-1){cur=sd.l[0];scr=sd.l[1]||0}}
buildNav();render();updV();
</script></body></html>
